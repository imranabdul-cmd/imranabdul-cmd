<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Imran A — 3D AI Referee Lab</title>
  <meta name="description" content="Interactive Three.js visual lab for Imran A — Software Engineer and AI Engineer.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #02030a;
      --cyan: #22d3ee;
      --pink: #ff2d55;
      --violet: #a855f7;
      --text: #d9e6f2;
      --muted: #71859a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed;
      inset: 20px 20px auto 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }
    .brand, .status {
      border: 1px solid rgba(34,211,238,.28);
      background: linear-gradient(135deg, rgba(5,9,18,.85), rgba(11,10,24,.65));
      backdrop-filter: blur(14px);
      box-shadow: 0 0 40px rgba(0,0,0,.35), inset 0 0 28px rgba(34,211,238,.03);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .brand strong {
      display: block;
      font-size: 18px;
      letter-spacing: .16em;
      background: linear-gradient(90deg,#fff,#e8d9ff,#7eefff);
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
    }
    .brand span, .status span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .status { text-align: right; border-color: rgba(168,85,247,.28); }
    .status strong { color: #dffcff; font-size: 12px; letter-spacing: .12em; }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: #38f5a2;
      box-shadow: 0 0 14px #38f5a2;
      animation: blink 1.8s ease-in-out infinite;
    }
    .legend {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 5;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,45,85,.25);
      background: rgba(4,6,13,.72);
      backdrop-filter: blur(12px);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
      line-height: 1.65;
      pointer-events: none;
    }
    .legend b { color: #c7f8ff; }
    .hint {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 5;
      color: rgba(217,230,242,.55);
      font-size: 10px;
      letter-spacing: .14em;
      pointer-events: none;
      text-transform: uppercase;
    }
    @keyframes blink { 50% { opacity: .35; } }
  </style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <div class="brand">
    <strong>IMRAN A</strong>
    <span>3D AI ENGINEERING LAB</span>
  </div>
  <div class="status">
    <strong><i class="dot"></i>AI REFEREE ONLINE</strong>
    <span>Observe · analyze · guide</span>
  </div>
</div>

<div class="legend">
  <b>SCENE SIGNAL</b><br>
  fixed AI core · walking referee bot · node scan · live code field
</div>
<div class="hint">move pointer to steer the camera</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x02030a, 0.018);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 12, 26);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.querySelector('#app').appendChild(renderer.domElement);

// --- lighting ---
scene.add(new THREE.AmbientLight(0x26334a, 0.8));

const redLight = new THREE.PointLight(0xff2d55, 22, 44, 2.0);
redLight.position.set(-11, 8, 3);
scene.add(redLight);

const cyanLight = new THREE.PointLight(0x22d3ee, 28, 50, 2.0);
cyanLight.position.set(12, 7, -2);
scene.add(cyanLight);

const violetLight = new THREE.PointLight(0xa855f7, 20, 40, 2);
violetLight.position.set(0, 12, -10);
scene.add(violetLight);

// --- ground / arena ---
const arena = new THREE.Group();
scene.add(arena);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(17, 96),
  new THREE.MeshStandardMaterial({ color: 0x070b13, roughness: .86, metalness: .15 })
);
floor.rotation.x = -Math.PI / 2;
arena.add(floor);

const ringMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: .42 });
for (const [r, color, opacity] of [[5.6,0xff2d55,.65],[8.6,0xa855f7,.42],[12.4,0x22d3ee,.24]]) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(r-.018,r+.018,128), new THREE.MeshBasicMaterial({color,transparent:true,opacity}));
  ring.rotation.x = -Math.PI / 2;
  arena.add(ring);
}
for (let i=0;i<24;i++) {
  const a = i / 24 * Math.PI * 2;
  const tick = new THREE.Mesh(new THREE.BoxGeometry(.06,.025,.55), new THREE.MeshBasicMaterial({color: i%2 ? 0x22d3ee : 0xff2d55, transparent:true, opacity:.32}));
  tick.position.set(Math.cos(a)*12.8,.02,Math.sin(a)*12.8);
  tick.rotation.y = -a;
  arena.add(tick);
}

// --- fixed AI core ---
const core = new THREE.Group();
core.position.set(0,4.3,0);
scene.add(core);

const coreShell = new THREE.Mesh(
  new THREE.SphereGeometry(2.1, 48, 48),
  new THREE.MeshPhysicalMaterial({
    color: 0x091222,
    emissive: 0x172640,
    emissiveIntensity: 1.8,
    metalness: .5,
    roughness: .16,
    transparent: true,
    opacity: .94
  })
);
core.add(coreShell);

const inner = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.45, 3),
  new THREE.MeshStandardMaterial({color:0x0b1424,emissive:0x22d3ee,emissiveIntensity:2.4,wireframe:true,transparent:true,opacity:.9})
);
core.add(inner);

const coreRingA = new THREE.Mesh(
  new THREE.TorusGeometry(2.55,.035,10,160),
  new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:.85})
);
coreRingA.rotation.x = Math.PI/2.3;
core.add(coreRingA);

const coreRingB = new THREE.Mesh(
  new THREE.TorusGeometry(3.05,.025,10,160),
  new THREE.MeshBasicMaterial({color:0xd946ef,transparent:true,opacity:.65})
);
coreRingB.rotation.z = Math.PI/2.7;
core.add(coreRingB);

// --- dot network ---
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);
const nodes = [];
const edges = [];
for (let i=0;i<12;i++) {
  const a = i/12*Math.PI*2;
  const r = 5.1 + (i%3)*1.2;
  const p = new THREE.Vector3(Math.cos(a)*r, 2.7 + (i%4)*.52, Math.sin(a)*r);
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(.08 + (i%3)*.025, 16, 16),
    new THREE.MeshBasicMaterial({color:i%3===0?0xff2d55:i%3===1?0x22d3ee:0xa855f7})
  );
  dot.position.copy(p);
  nodeGroup.add(dot);
  nodes.push(p.clone());
}
for (let i=0;i<nodes.length;i++) {
  const j=(i+1)%nodes.length;
  const geom = new THREE.BufferGeometry().setFromPoints([nodes[i],nodes[j]]);
  const line = new THREE.Line(geom,new THREE.LineBasicMaterial({color: i%2?0x334b76:0x3f1c4a,transparent:true,opacity:.62}));
  nodeGroup.add(line);
  edges.push(line);
}

// --- code floating panels ---
const panel = new THREE.Group();
scene.add(panel);
function addCodePlate(x,y,z,text,color) {
  const canvas = document.createElement('canvas');
  canvas.width = 700; canvas.height = 220;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(5,9,18,0.93)';
  ctx.fillRect(0,0,700,220);
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.strokeRect(3,3,694,214);
  ctx.font = '700 26px ui-monospace,monospace';
  ctx.fillStyle = '#8fefff';
  ctx.fillText('LIVE CODE',28,45);
  ctx.font = '22px ui-monospace,monospace';
  ctx.fillStyle = '#e6eaf2';
  text.split('\\n').forEach((line,idx)=>ctx.fillText(line,28,88+idx*36));
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(6.7,2.1),
    new THREE.MeshBasicMaterial({map:tex,transparent:true})
  );
  mesh.position.set(x,y,z);
  mesh.lookAt(0,4,z-2);
  panel.add(mesh);
  return mesh;
}
addCodePlate(-9,6,-4,'const ai = referee(core)\\nai.observe(nodes)\\nai.guide(build)', '#ff2d55');
addCodePlate(9,5,-7,'retrieve(context)\\nreason()\\nship(product)', '#22d3ee');

// --- AI referee robot built with Three.js primitives ---
const bot = new THREE.Group();
scene.add(bot);

const robotBody = new THREE.Group();
bot.add(robotBody);

const metal = new THREE.MeshStandardMaterial({color:0x98a8b8,metalness:.55,roughness:.28});
const dark = new THREE.MeshStandardMaterial({color:0x0b111b,metalness:.7,roughness:.18});
const cyan = new THREE.MeshBasicMaterial({color:0x22d3ee});
const pink = new THREE.MeshBasicMaterial({color:0xff2d55});

// body
const torso = new THREE.Mesh(new THREE.BoxGeometry(1.15,1.45,.75),dark);
torso.position.y=2.05; robotBody.add(torso);
const chest = new THREE.Mesh(new THREE.BoxGeometry(.74,.55,.08),cyan);
chest.position.set(0,2.18,.41); robotBody.add(chest);

// head
const head = new THREE.Mesh(new THREE.SphereGeometry(.58,32,24),metal);
head.scale.set(1,1.02,.86);
head.position.y=3.35; robotBody.add(head);

// visor
const visor = new THREE.Mesh(new THREE.BoxGeometry(.72,.2,.06),new THREE.MeshBasicMaterial({color:0x07131d}));
visor.position.set(0,3.36,.5); robotBody.add(visor);

const eyeL = new THREE.Mesh(new THREE.SphereGeometry(.055,12,12),cyan);
const eyeR = new THREE.Mesh(new THREE.SphereGeometry(.055,12,12),cyan);
eyeL.position.set(-.16,3.36,.54); eyeR.position.set(.16,3.36,.54); robotBody.add(eyeL,eyeR);

// antenna
const antenna = new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.45,10),new THREE.MeshBasicMaterial({color:0xa855f7}));
antenna.position.set(0,4,.02); robotBody.add(antenna);
const antennaTip = new THREE.Mesh(new THREE.SphereGeometry(.09,16,16),pink);
antennaTip.position.set(0,4.24,.02); robotBody.add(antennaTip);

// arms
function limb(x) {
  const g = new THREE.Group();
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.11,.58,6,10),metal);
  arm.position.y=-.35; g.add(arm);
  g.position.set(x,2.48,0);
  return g;
}
const armL=limb(-.78), armR=limb(.78);
robotBody.add(armL,armR);

// legs
function leg(x) {
  const g=new THREE.Group();
  const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.58,6,10),dark);
  thigh.position.y=-.36; g.add(thigh);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(.34,.18,.62),metal);
  foot.position.set(0,-.8,.15); g.add(foot);
  g.position.set(x,1.35,0);
  return g;
}
const legL=leg(-.3), legR=leg(.3);
robotBody.add(legL,legR);

// referee baton
const baton = new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.8,12),new THREE.MeshBasicMaterial({color:0x22d3ee}));
baton.position.set(.98,2.7,.08);
baton.rotation.z=-.45;
robotBody.add(baton);

// robot position: walk around center on a circular referee route
const routeRadius = 7.7;
let routeAngle = Math.PI*.15;

// ambient particles
const particleCount = 900;
const positions = new Float32Array(particleCount*3);
for(let i=0;i<particleCount;i++){
  positions[i*3]=(Math.random()-.5)*46;
  positions[i*3+1]=Math.random()*16+.5;
  positions[i*3+2]=(Math.random()-.5)*36;
}
const particleGeom = new THREE.BufferGeometry();
particleGeom.setAttribute('position',new THREE.BufferAttribute(positions,3));
const particleMat = new THREE.PointsMaterial({color:0x88dfff,size:.025,transparent:true,opacity:.35});
const particles = new THREE.Points(particleGeom,particleMat);
scene.add(particles);

// --- interaction ---
let mouseX=0,mouseY=0;
addEventListener('pointermove',e=>{
  mouseX=(e.clientX/innerWidth-.5);
  mouseY=(e.clientY/innerHeight-.5);
});

// --- animation ---
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  // fixed AI core with internal animation only
  inner.rotation.x += .004;
  inner.rotation.y -= .007;
  coreRingA.rotation.z += .004;
  coreRingB.rotation.x -= .003;
  const glow = 1.0 + Math.sin(t*2.3)*.07;
  core.scale.setScalar(glow);

  // nodes pulse, positions stay fixed
  nodes.forEach((_,i)=>{
    const s=1 + Math.sin(t*2.1 + i*.7)*.18;
    nodeGroup.children[i*1]?.scale.setScalar(s);
  });

  // referee robot walks around the fixed AI core
  routeAngle += 0.0065;
  bot.position.set(Math.cos(routeAngle)*routeRadius,0,Math.sin(routeAngle)*routeRadius);
  bot.lookAt(0,2.2,0);

  const walk=Math.sin(t*10.5);
  legL.rotation.x = walk*.46;
  legR.rotation.x = -walk*.46;
  armL.rotation.x = -walk*.26;
  armR.rotation.x = walk*.26;
  baton.rotation.z = -.45 + walk*.05;
  bot.position.y = Math.sin(t*5.25)*.025;

  // robot scans the nearest node with the baton
  const nearest = Math.floor(((routeAngle%(Math.PI*2))/(Math.PI*2))*nodes.length);
  if (edges[nearest]) edges[nearest].material.opacity = .45 + (Math.sin(t*6)+1)*.18;

  // slow camera drift
  camera.position.x += ((mouseX*5) - camera.position.x) * .015;
  camera.position.y += ((10 - mouseY*3) - camera.position.y) * .015;
  camera.lookAt(0,3.4,0);

  redLight.position.x = -11 + Math.sin(t*.35)*2;
  cyanLight.position.z = -2 + Math.cos(t*.4)*3;

  particles.rotation.y += .00028;
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
