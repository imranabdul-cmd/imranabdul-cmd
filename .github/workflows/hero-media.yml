name: Build optimized cinematic hero media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Inspect source video
        run: |
          test -f assets/Man_typing_code_at_workstation_20260927120945.mp4
          echo "SOURCE FILE:"
          ls -lh assets/Man_typing_code_at_workstation_20260927120945.mp4
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate             -of default=noprint_wrappers=1             assets/Man_typing_code_at_workstation_20260927120945.mp4

      - name: Render branded title
        run: |
          rsvg-convert -w 760 -h 240 assets/hero-title.svg -o /tmp/hero-title.png

      - name: Build poster
        run: |
          ffmpeg -y             -ss 3.0             -i assets/Man_typing_code_at_workstation_20260927120945.mp4             -frames:v 1             -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2"             /tmp/hero-base.png

          ffmpeg -y             -i /tmp/hero-base.png             -i /tmp/hero-title.png             -filter_complex "[1:v]format=rgba[title];[0:v][title]overlay=45:45"             /tmp/hero-poster.png

          ffmpeg -y             -i /tmp/hero-poster.png             -c:v libwebp             -q:v 68             assets/hero-poster.webp

      - name: Build optimized H.264 hero
        run: |
          ffmpeg -y             -i assets/Man_typing_code_at_workstation_20260927120945.mp4             -i /tmp/hero-title.png             -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2[base];[1:v]format=rgba,fade=t=in:st=0.6:d=0.7:alpha=1[title];[base][title]overlay=x='45+4*sin(t*0.8)':y=45:enable='between(t,0.5,7.5)'[v]"             -map "[v]"             -an             -c:v libx264             -preset medium             -crf 28             -pix_fmt yuv420p             -movflags +faststart             assets/hero.mp4

      - name: Build animated fallback
        run: |
          ffmpeg -y             -i assets/hero.mp4             -vf "fps=10,scale=480:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a"             -loop 0             assets/hero.gif

      - name: Validate final media
        run: |
          echo "FINAL hero.mp4:"
          ls -lh assets/hero.mp4
          ffprobe -v error             -show_entries format=size,duration             -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate             -of default=noprint_wrappers=1             assets/hero.mp4

          echo "FINAL hero.gif:"
          ls -lh assets/hero.gif

          echo "FINAL hero-poster.webp:"
          ls -lh assets/hero-poster.webp

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/hero.mp4 assets/hero.gif assets/hero-poster.webp

          if git diff --cached --quiet; then
            echo "Generated media is already up to date."
            exit 0
          fi

          git commit -m "Add optimized cinematic hero media"
          git push origin HEAD:main
