name: Build optimized cinematic hero media

on:
  push:
    branches: [main]
    paths:
      - 'assets/Man_typing_code_at_workstation_20260927120945.mp4'
      - 'assets/hero-title.svg'
      - '.github/workflows/hero-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Validate source video
        run: |
          test -f assets/Man_typing_code_at_workstation_20260927120945.mp4
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            assets/Man_typing_code_at_workstation_20260927120945.mp4

      - name: Build branded poster
        run: |
          ffmpeg -y \
            -ss 3.0 \
            -i assets/Man_typing_code_at_workstation_20260927120945.mp4 \
            -frames:v 1 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
            /tmp/hero-base.png

          rsvg-convert -w 760 -h 240 assets/hero-title.svg -o /tmp/hero-title.png

          ffmpeg -y \
            -i /tmp/hero-base.png \
            -i /tmp/hero-title.png \
            -filter_complex "[1:v]format=rgba[title];[0:v][title]overlay=45:45" \
            /tmp/hero-poster.png

          ffmpeg -y \
            -i /tmp/hero-poster.png \
            -c:v libwebp \
            -q:v 68 \
            assets/hero-poster.webp

      - name: Build optimized branded H.264 hero
        run: |
          rsvg-convert -w 760 -h 240 assets/hero-title.svg -o /tmp/hero-title.png

          ffmpeg -y \
            -i assets/Man_typing_code_at_workstation_20260927120945.mp4 \
            -i /tmp/hero-title.png \
            -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2[base];[1:v]format=rgba,fade=t=in:st=0.6:d=0.7:alpha=1[title];[base][title]overlay=x='45+4*sin(t*0.8)':y=45:enable='between(t,0.5,7.5)'[v]" \
            -map "[v]" \
            -an \
            -c:v libx264 \
            -preset medium \
            -crf 28 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            assets/hero.mp4

      - name: Build animated GitHub fallback
        run: |
          ffmpeg -y \
            -i assets/hero.mp4 \
            -vf "fps=10,scale=480:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a" \
            -loop 0 \
            assets/hero.gif

      - name: Promote generated hero in README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          old = '''<p align="center">
  <a href="assets/Man_typing_code_at_workstation_20260927120945.mp4">
    <img src="assets/hero.svg" width="100%" alt="Imran A — futuristic cinematic AI engineering hero; click to open the cinematic video" />
  </a>
</p>

<p align="center">
  <a href="assets/Man_typing_code_at_workstation_20260927120945.mp4"><strong>▶ WATCH THE CINEMATIC INTRO</strong></a>
</p>

'''
          new = '''<p align="center">
  <a href="assets/hero.mp4">
    <img src="assets/hero.gif" width="100%" alt="Cinematic futuristic hero animation of Imran A coding in an AI engineering environment" />
  </a>
</p>

<p align="center">
  <a href="assets/hero.mp4"><strong>▶ WATCH THE CINEMATIC INTRO</strong></a>
</p>

'''
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
          else:
              print("README hero fallback block not found; leaving README unchanged.")
          PY

      - name: Show final media metrics
        run: |
          echo "Final hero.mp4:"
          ls -lh assets/hero.mp4
          ffprobe -v error \
            -show_entries format=size,duration \
            -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate \
            -of default=noprint_wrappers=1 \
            assets/hero.mp4

          echo "Fallback GIF:"
          ls -lh assets/hero.gif

          echo "Poster:"
          ls -lh assets/hero-poster.webp

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.mp4 assets/hero.gif assets/hero-poster.webp

          if git diff --cached --quiet; then
            echo "No generated media changes."
            exit 0
          fi

          git commit -m "Build optimized cinematic hero media [skip hero]"
          # The README/workflow can change while media is being rendered. Rebase
          # the generated-media commit onto the latest main before pushing.
          git fetch origin main
          git rebase origin/main
          git push
