<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-label="Imran A futuristic AI engineering command center">
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#03040a"/><stop offset=".45" stop-color="#0b1020"/><stop offset="1" stop-color="#020309"/></linearGradient>
<linearGradient id="neon" x1="0" x2="1"><stop stop-color="#ff2d55"><animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#d946ef"/><stop offset="1" stop-color="#22d3ee"><animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
<radialGradient id="redGlow"><stop stop-color="#ff2d55" stop-opacity=".32"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>
<radialGradient id="blueGlow"><stop stop-color="#22d3ee" stop-opacity=".24"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
<style>
.scan{animation:scan 5.5s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}.dash{stroke-dasharray:8 14;animation:dash 4s linear infinite}@keyframes scan{from{transform:translateX(-400px)}to{transform:translateX(1500px)}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes dash{to{stroke-dashoffset:-120}}
</style>
</defs>
<rect width="1400" height="560" rx="34" fill="url(#bg)"/>
<ellipse cx="250" cy="150" rx="360" ry="300" fill="url(#redGlow)" filter="url(#soft)"/>
<ellipse cx="1200" cy="170" rx="360" ry="280" fill="url(#blueGlow)" filter="url(#soft)"/>
<g opacity=".16" stroke="#6d7c9a"><path d="M0 80H1400M0 160H1400M0 240H1400M0 320H1400M0 400H1400M0 480H1400"/><path d="M140 0V560M280 0V560M420 0V560M560 0V560M700 0V560M840 0V560M980 0V560M1120 0V560M1260 0V560"/></g>
<rect class="scan" x="-360" y="0" width="260" height="560" fill="#22d3ee" opacity=".035" filter="url(#soft)"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="62" y="64" fill="#7defff" font-size="15" font-weight="700" letter-spacing="6">AI ENGINEERING / PERSONAL LAB</text>
  <text x="62" y="160" fill="url(#neon)" filter="url(#glow)" font-size="86" font-weight="900" letter-spacing="7">IMRAN A</text>
  <text x="66" y="210" fill="url(#cyan)" font-size="23" font-weight="700" letter-spacing="5">SOFTWARE ENGINEER  •  AI ENGINEER</text>
  <text x="66" y="247" fill="#b8c6d7" font-size="15" letter-spacing="2">SOFTWARE × AI × GENERATIVE AI × PRODUCT ENGINEERING</text>
  <rect x="62" y="286" width="400" height="168" rx="22" fill="#050a14" fill-opacity=".82" stroke="url(#neon)" stroke-width="2"/>
  <text x="88" y="321" fill="#ff7896" font-size="12" font-weight="700" letter-spacing="3">LIVE INFERENCE / CLARA</text>
  <text x="88" y="354" fill="#79f0ff" font-family="monospace" font-size="14">&gt; context.retrieve(policy, claims)</text>
  <text x="88" y="382" fill="#b78cff" font-family="monospace" font-size="14">&gt; grounding.vector_search()</text>
  <text x="88" y="410" fill="#ff6a87" font-family="monospace" font-size="14">&gt; response.stream<span class="pulse">_</span></text>
  <text x="88" y="438" fill="#60748e" font-family="monospace" font-size="11">RAG • VECTOR • TOOLING • LLM</text>
  <g transform="translate(850,85)" class="float">
    <rect x="0" y="0" width="470" height="340" rx="28" fill="#050a14" fill-opacity=".86" stroke="url(#cyan)" stroke-width="2"/>
    <text x="28" y="38" fill="#7fefff" font-size="12" font-weight="700" letter-spacing="3">NEURAL OPERATIONS / ACTIVE</text>
    <g opacity=".3" stroke="#4d7891"><path d="M30 90H440M30 150H440M30 210H440M30 270H440"/></g>
    <path d="M45 270 C105 244 130 230 175 242 S250 216 292 180 S365 170 420 95" fill="none" stroke="url(#neon)" stroke-width="6" filter="url(#glow)"/>
    <g fill="#22d3ee" filter="url(#glow)">
      <circle cx="95" cy="248" r="7"/><circle cx="176" cy="242" r="7"/><circle cx="292" cy="180" r="7"/><circle cx="420" cy="95" r="8"/>
    </g>
    <text x="30" y="318" fill="#ff7896" font-size="13">PRODUCT SIGNAL</text>
    <text x="170" y="318" fill="#90a2b7" font-size="13">retrieval → generation → delivery</text>
  </g>
  <g class="float" transform="translate(620,120)">
    <rect width="165" height="125" rx="18" fill="#060b16" stroke="#a855f7" stroke-width="2"/>
    <text x="20" y="30" fill="#d9bcff" font-size="11" font-weight="700" letter-spacing="2">VECTOR SPACE</text>
    <g stroke="#d946ef" stroke-width="2" fill="#22d3ee" filter="url(#glow)"><circle cx="40" cy="82" r="5"/><circle cx="82" cy="60" r="5"/><circle cx="116" cy="84" r="5"/><circle cx="72" cy="98" r="5"/><path d="M40 82L82 60L116 84L72 98Z" fill="none"/></g>
  </g>
  <g transform="translate(560,390)">
    <circle class="pulse" cx="0" cy="0" r="7" fill="#ff2d55" filter="url(#glow)"/><text x="18" y="5" fill="#ff7b96" font-size="12">SYSTEM ONLINE</text>
  </g>
</g>
<path class="dash" d="M510 472 C680 420 760 420 910 460" fill="none" stroke="url(#neon)" stroke-width="2"/>
</svg>