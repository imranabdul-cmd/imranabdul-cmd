<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Technology stack data flow"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020204"/><stop offset=".55" stop-color="#090713"/><stop offset="1" stop-color="#030d13"/></linearGradient><linearGradient id="hot" x2="1"><stop stop-color="#ff2d55"/><stop offset=".48" stop-color="#f43f5e"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="28"/></filter><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#38bdf8" stroke-opacity=".08"/></pattern><style><![CDATA[.pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 5s linear infinite}.dash{stroke-dasharray:8 13;animation:dash 3.5s linear infinite}@keyframes pulse{50%{opacity:.38}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes scan{from{transform:translateY(-180px)}to{transform:translateY(700px)}}@keyframes dash{to{stroke-dashoffset:-105}}]]></style></defs><rect width="1200" height="500" rx="22" fill="url(#bg)"/><rect width="1200" height="500" rx="22" fill="url(#grid)"/><text x="58" y="54" fill="#ff637b" font-family="Arial" font-size="12" letter-spacing="4">TECH DNA • FLOWING PRODUCT STACK</text><path d="M600 82V435" stroke="url(#hot)" stroke-width="3" class="dash"/><g font-family="Arial" text-anchor="middle"><g class="float"><rect x="325" y="85" width="550" height="50" rx="25" fill="#07111a" stroke="#ff2d55" stroke-opacity=".75"/><circle cx="357" cy="110" r="8" fill="#ff2d55" filter="url(#glow)" class="pulse"/><text x="500" y="115" fill="#ff2d55" font-size="13" font-weight="700" letter-spacing="3">LANGUAGES</text><text x="725" y="115" fill="#a1c5cd" font-size="12">Python • C# • TypeScript</text></g><g class="float"><rect x="325" y="153" width="550" height="50" rx="25" fill="#07111a" stroke="#a855f7" stroke-opacity=".75"/><circle cx="357" cy="178" r="8" fill="#a855f7" filter="url(#glow)" class="pulse"/><text x="500" y="183" fill="#a855f7" font-size="13" font-weight="700" letter-spacing="3">AI / ML</text><text x="725" y="183" fill="#a1c5cd" font-size="12">TensorFlow • PyTorch • Gemini</text></g><g class="float"><rect x="325" y="221" width="550" height="50" rx="25" fill="#07111a" stroke="#22d3ee" stroke-opacity=".75"/><circle cx="357" cy="246" r="8" fill="#22d3ee" filter="url(#glow)" class="pulse"/><text x="500" y="251" fill="#22d3ee" font-size="13" font-weight="700" letter-spacing="3">BACKEND</text><text x="725" y="251" fill="#a1c5cd" font-size="12">ASP.NET Core • FastAPI • LangChain</text></g><g class="float"><rect x="325" y="289" width="550" height="50" rx="25" fill="#07111a" stroke="#38bdf8" stroke-opacity=".75"/><circle cx="357" cy="314" r="8" fill="#38bdf8" filter="url(#glow)" class="pulse"/><text x="500" y="319" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="3">DATA</text><text x="725" y="319" fill="#a1c5cd" font-size="12">PostgreSQL • pgvector • Databricks</text></g><g class="float"><rect x="325" y="357" width="550" height="50" rx="25" fill="#07111a" stroke="#ff3b30" stroke-opacity=".75"/><circle cx="357" cy="382" r="8" fill="#ff3b30" filter="url(#glow)" class="pulse"/><text x="500" y="387" fill="#ff3b30" font-size="13" font-weight="700" letter-spacing="3">CLOUD</text><text x="725" y="387" fill="#a1c5cd" font-size="12">GitHub • Railway • Fabric</text></g><g class="float"><rect x="325" y="425" width="550" height="50" rx="25" fill="#07111a" stroke="#00e5ff" stroke-opacity=".75"/><circle cx="357" cy="450" r="8" fill="#00e5ff" filter="url(#glow)" class="pulse"/><text x="500" y="455" fill="#00e5ff" font-size="13" font-weight="700" letter-spacing="3">PRODUCT</text><text x="725" y="455" fill="#a1c5cd" font-size="12">React • APIs • Delivery</tex