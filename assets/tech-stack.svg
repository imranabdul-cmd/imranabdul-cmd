<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-label="Technology stack: Python language, TensorFlow AI ML, React frontend, PostgreSQL database, Databricks data engineering, and FastAPI backend"><defs>
