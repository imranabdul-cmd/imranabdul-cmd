<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GT Companion" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#ffb84d"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#05070f"/><stop offset="1" stop-color="#0d1233"/></linearGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#ffb84d" stop-opacity="0"/><stop offset=".5" stop-color="#ffb84d" stop-opacity=".18"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect x="3" y="3" width="994" height="224" rx="18"/></clipPath></defs>
<rect x="3" y="3" width="994" height="224" rx="18" fill="url(#bg)"/>
<g clip-path="url(#cp)"><rect x="-200" y="0" width="200" height="230" fill="url(#sw)"><animate attributeName="x" values="-200;1000" dur="5s" repeatCount="indefinite"/></rect></g>
<rect x="3" y="3" width="994" height="224" rx="18" fill="none" stroke="url(#b)" stroke-width="2.5" stroke-dasharray="180 60"><animate attributeName="stroke-dashoffset" values="0;-240" dur="3s" repeatCount="indefinite"/></rect>
<g transform="translate(88 100)" filter="url(#glow)"><polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="url(#b)" stroke-width="3"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/></polygon>
<polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#ffb84d" fill-opacity=".2" stroke="#ff2bd6" stroke-width="2"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="9s" repeatCount="indefinite"/></polygon><circle r="6" fill="#ffb84d"><animate attributeName="r" values="4;8;4" dur="1.6s" repeatCount="indefinite"/></circle></g>
<text x="170" y="66" font-family="Verdana,Arial,sans-serif" font-weight="900" font-size="34" fill="url(#b)">GT Companion</text>
<text x="170" y="92" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#ffb84d">Training &amp; Knowledge Platform</text>
<text x="170" y="128" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#d6e4ff">Roadmaps, study material, videos and quizzes gathered into one structured path.</text>
<text x="170" y="152" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#d6e4ff">Pico (AI) tells new trainees where to start and what to learn next.</text><rect x="170" y="176" width="62" height="26" rx="13" fill="#0a1030" stroke="#ffb84d" stroke-opacity=".7"/><text x="201" y="194" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#dbe8ff">React</text><rect x="242" y="176" width="101" height="26" rx="13" fill="#0a1030" stroke="#ffb84d" stroke-opacity=".7"/><text x="292" y="194" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#dbe8ff">TypeScript</text><rect x="352" y="176" width="117" height="26" rx="13" fill="#0a1030" stroke="#ffb84d" stroke-opacity=".7"/><text x="411" y="194" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#dbe8ff">ASP.NET Core</text><rect x="479" y="176" width="77" height="26" rx="13" fill="#0a1030" stroke="#ffb84d" stroke-opacity=".7"/><text x="518" y="194" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#dbe8ff">FastAPI</text><rect x="567" y="176" width="93" height="26" rx="13" fill="#0a1030" stroke="#ffb84d" stroke-opacity=".7"/><text x="613" y="194" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#dbe8ff">LangChain</text><rect x="670" y="176" width="85" height="26" rx="13" fill="#0a1030" stroke="#ffb84d" stroke-opacity=".7"/><text x="712" y="194" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#dbe8ff">pgvector</text>
<rect x="854" y="28" width="106" height="32" rx="16" fill="#ff2bd6" fill-opacity=".18" stroke="#ff2bd6"><animate attributeName="stroke-opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></rect>
<text x="907" y="49" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#fff">AI: Pico</text>
