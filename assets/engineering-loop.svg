<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Imran A engineering loop">
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#03040a"/><stop offset=".5" stop-color="#0b1020"/><stop offset="1" stop-color="#03040a"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#ff2d55"/><stop offset=".35" stop-color="#d946ef"/><stop offset=".7" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.spin{transform-origin:600px 180px;animation:spin 18s linear infinite}.pulse{animation:pulse 2.3s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}</style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="600" cy="180" r="104" fill="none" stroke="url(#g)" stroke-width="2" opacity=".65"/>
<circle class="spin" cx="600" cy="180" r="145" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="10 18"/>
<circle class="spin" cx="600" cy="180" r="185" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2 16" style="animation-duration:28s"/>
<g font-family="Arial" text-anchor="middle">
<circle cx="600" cy="180" r="58" fill="#070c18" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/>
<text x="600" y="175" fill="#fff" font-size="20" font-weight="800">BUILD</text><text x="600" y="197" fill="#8fefff" font-size="11" letter-spacing="3">ENGINEERING LOOP</text>
<g><circle cx="600" cy="30" r="28" fill="#09111d" stroke="#22d3ee" stroke-width="2"/><text x="600" y="35" fill="#8fefff" font-size="12" font-weight="700">DISCOVER</text></g>
<g><circle cx="750" cy="85" r="28" fill="#09111d" stroke="#a855f7" stroke-width="2"/><text x="750" y="90" fill="#d9c3ff" font-size="12" font-weight="700">DESIGN</text></g>
<g><circle cx="770" cy="250" r="28" fill="#09111d" stroke="#ff2d55" stroke-width="2"/><text x="770" y="255" fill="#ff9aae" font-size="12" font-weight="700">BUILD</text></g>
<g><circle cx="450" cy="250" r="28" fill="#09111d" stroke="#10b981" stroke-width="2"/><text x="450" y="255" fill="#9ef5cf" font-size="12" font-weight="700">MEASURE</text></g>
<g><circle cx="430" cy="85" r="28" fill="#09111d" stroke="#d946ef" stroke-width="2"/><text x="430" y="90" fill="#efc5ff" font-size="12" font-weight="700">LEARN</text></g>
</g>
<g stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".65"><path d="M600 58L600 95M724 104L672 130M744 226L670 210M476 226L528 210M456 104L528 130"/></g>
<text x="600" y="330" text-anchor="middle" fill="#7f95aa" font-family="Arial" font-size="13" letter-spacing="3">PROBLEM → PRODUCT → INTELLIGENCE → DATA → DELIVERY → LEARNING</text>
</svg>