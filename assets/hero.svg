<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Imran A — AI engineering command center</title><desc id="desc">An animated futuristic workspace showing a software and AI engineer at a glowing laptop.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset=".55" stop-color="#15070c"/><stop offset="1" stop-color="#061014"/></linearGradient>
 <radialGradient id="red"><stop stop-color="#ff2949" stop-opacity=".8"/><stop offset="1" stop-color="#ff2949" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".65"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#0c2730"/><stop offset="1" stop-color="#071018"/></linearGradient><linearGradient id="edge"><stop stop-color="#ff2949"/><stop offset=".48" stop-color="#ff7587"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4d6270" stroke-opacity=".14"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1200" height="560" rx="18" fill="url(#bg)"/><rect width="1200" height="560" fill="url(#grid)"/><ellipse cx="245" cy="230" rx="230" ry="190" fill="url(#red)" filter="url(#soft)"/><ellipse cx="980" cy="185" rx="250" ry="160" fill="url(#cyan)" filter="url(#soft)"/>
<!-- scan lines --> <g stroke="#b9d9df" stroke-opacity=".06"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200"/></g>
<!-- left terminal --> <g transform="translate(55 115)"><rect width="245" height="160" rx="10" fill="#071017" stroke="#ff3854" stroke-opacity=".65"/><path d="M0 28H245" stroke="#ff3854" stroke-opacity=".35"/><circle cx="16" cy="14" r="4" fill="#ff3854"/><circle cx="30" cy="14" r="4" fill="#22d3ee"/><text x="48" y="18" fill="#9aabb4" font-family="monospace" font-size="10">CLARA / SYSTEM READY</text><g font-family="monospace" font-size="11"><text x="16" y="53" fill="#ff6074">&gt; ingest.family_context()</text><text x="16" y="76" fill="#79e6f5">  policy_vector: indexed</text><text x="16" y="99" fill="#ccd9dd">  retrieval: active</text><text x="16" y="122" fill="#ff6074">&gt; compose_assistance()</text><text x="16" y="145" fill="#79e6f5">  response: streaming_</text></g></g>
<!-- right nodes / terminal --> <g transform="translate(885 88)"><rect width="260" height="174" rx="10" fill="#071017" stroke="#22d3ee" stroke-opacity=".6"/><text x="18" y="25" fill="#8cabb0" font-family="monospace" font-size="10">NEURAL SIGNAL / 01</text><g stroke="#22d3ee" stroke-opacity=".55" fill="#08161b"><path d="M45 78L110 52L176 87L215 48M110 52L135 130L176 87M45 78L80 134L135 130L215 120"/><g fill="#22d3ee" filter="url(#glow)"><circle cx="45" cy="78" r="5"/><circle cx="110" cy="52" r="5"/><circle cx="176" cy="87" r="5"/><circle cx="215" cy="48" r="5"/><circle cx="80" cy="134" r="5"/><circle cx="135" cy="130" r="5"/><circle cx="215" cy="120" r="5"/></g></g></g>
<!-- engineer --> <g transform="translate(410 130)"><ellipse cx="190" cy="355" rx="255" ry="34" fill="#020407"/><path d="M105 315Q117 218 178 205Q244 195 282 251L313 315Z" fill="#151c27" stroke="#556473"/><path d="M159 213Q142 161 157 115Q178 69 224 91Q260 117 245 173L229 217Z" fill="#c58b79"/><path d="M151 141Q139 81 188 70Q238 70 252 115Q225 101 205 120Q181 102 151 141" fill="#121821"/><path d="M173 157q15 9 29 0M216 155q12 7 22-2" stroke="#311c1c" stroke-width="3" fill="none"/><path d="M200 190q16 11 30 0" stroke="#9b4d4d" stroke-width="3" fill="none"/><path d="M169 218L150 295M239 218L276 288" stroke="#c58b79" stroke-width="20" stroke-linecap="round"/>
 <!-- laptop --><g transform="translate(105 265)"><path d="M35 0H252L278 105H9Z" fill="url(#screen)" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/><rect x="48" y="14" width="191" height="76" rx="3" fill="#07131a"/><g font-family="monospace" font-size="8"><text x="61" y="34" fill="#22d3ee">def engineer(idea):</text><text x="70" y="49" fill="#ff6074"> return product + ai</text><text x="70" y="65" fill="#b7f6ff"> deploy(confidence)</text></g><path d="M0 107H286L315 128H-26Z" fill="#101925" stroke="#7d9aa0"/><path d="M112 115H180" stroke="#ff6074" stroke-width="3"/></g></g>
<!-- labels --> <g font-family="Arial, sans-serif"><text x="55" y="355" fill="#ff6578" font-size="13" letter-spacing="4">SOFTWARE × AI × GENERATIVE AI</text><text x="55" y="405" fill="#f4f8fa" font-size="55" font-weight="700" letter-spacing="3">IMRAN A</text><text x="58" y="438" fill="#aabac1" font-size="17" letter-spacing="5">SOFTWARE ENGINEER  /  AI ENGINEER</text><path d="M58 461H330" stroke="url(#edge)" stroke-width="3"/><text x="58" y="491" fill="#7d969f" font-size="14" letter-spacing="2">PRODUCT ENGINEERING • INTELLIGENT SYSTEMS</text></g>
<!-- streams --> <g fill="none" stroke-linecap="round"><path d="M0 522H370" stroke="#ff2949" stroke-opacity=".5" stroke-dasharray="10 18"><animate attributeName="stroke-dashoffset" values="0;-56" dur="2s" repeatCount="indefinite"/></path><path d="M800 525H1200" stroke="#22d3ee" stroke-opacity=".5" stroke-dasharray="8 20"><animate attributeName="stroke-dashoffset" values="0;56" dur="2.5s" repeatCount="indefinite"/></path></g>
<g fill="#fff"><circle cx="344" cy="87" r="2"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle><circle cx="825" cy="326" r="2"><animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="1100" cy="360" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></circle></g>
<rect x="10" y="10" width="1180" height="540" rx="14" fill="none" stroke="url(#edge)" stroke-opacity=".55"/>
</svg>
