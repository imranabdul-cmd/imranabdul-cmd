<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Imran A — Software Engineer and AI Engineer</title><desc id="desc">A cinematic illustration of a software engineer at a glowing laptop in a dark red and cyan AI engineering workspace.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030406"/><stop offset=".53" stop-color="#150609"/><stop offset="1" stop-color="#02080b"/></linearGradient>
 <radialGradient id="red"><stop stop-color="#ff2648" stop-opacity=".75"/><stop offset="1" stop-color="#ff2648" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#31d7e8" stop-opacity=".42"/><stop offset="1" stop-color="#31d7e8" stop-opacity="0"/></radialGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#101c26"/><stop offset=".5" stop-color="#081016"/><stop offset="1" stop-color="#dc1838"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7debf2" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="560" rx="18" fill="url(#bg)"/><rect width="1200" height="560" rx="18" fill="url(#grid)"/>
<ellipse cx="255" cy="210" rx="310" ry="260" fill="url(#red)"/><ellipse cx="930" cy="190" rx="290" ry="250" fill="url(#cyan)"/>
<!-- scanline atmosphere --> <g stroke="#d9feff" stroke-opacity=".09"><path d="M0 96H1200M0 192H1200M0 288H1200M0 384H1200M0 480H1200"/></g>
<!-- terminal panels --> <g fill="#05090d" stroke="#2b5360" stroke-width="1"><rect x="56" y="66" width="250" height="156" rx="8"/><rect x="900" y="78" width="242" height="140" rx="8"/></g><g fill="#ef3150" opacity=".8"><circle cx="76" cy="86" r="4"/><circle cx="91" cy="86" r="4"/></g>
<g font-family="monospace" font-size="11" fill="#8debf2" opacity=".7"><text x="76" y="116">$ neural.connect()</text><text x="76" y="138">model: online</text><text x="76" y="160">signal: 98.7%</text><text x="920" y="112">/product/engine</text><text x="920" y="136">RAG  •  LLM  •  API</text><text x="920" y="160">deploy: ready</text></g>
<!-- neural network --> <g stroke="#61e8f5" stroke-opacity=".55" fill="#b7fbff" filter="url(#glow)"><path d="M814 284l52-47 50 40 60-62 55 53M814 284l58 44 44-51 64 48 51-39" fill="none"/><circle cx="814" cy="284" r="4"/><circle cx="866" cy="237" r="4"/><circle cx="916" cy="277" r="5"/><circle cx="976" cy="215" r="4"/><circle cx="1031" cy="268" r="5"/><circle cx="872" cy="328" r="4"/><circle cx="960" cy="325" r="4"/></g>
<!-- engineer silhouette --> <ellipse cx="596" cy="490" rx="230" ry="24" fill="#000" opacity=".65"/><circle cx="594" cy="243" r="53" fill="#090b10" stroke="#ef3150" stroke-opacity=".55"/><path d="M532 342q62-76 127 0l43 137H486z" fill="#070a0e" stroke="#3e8390" stroke-opacity=".45"/><path d="M548 319q46 26 92 0" fill="none" stroke="#ef3150" stroke-width="2" opacity=".65"/>
<!-- desk + laptop --> <path d="M301 447h599l45 45H258z" fill="#080b0f" stroke="#ef3150" stroke-opacity=".7"/><path d="M470 338h250l25 125H445z" fill="url(#screen)" stroke="#7ff7ff" stroke-opacity=".7"/><path d="M445 463h300l-35 18H480z" fill="#151c22" stroke="#ef3150"/><g font-family="monospace" font-size="12" fill="#e7ffff"><text x="492" y="375">&gt; build AI products</text><text x="492" y="398" fill="#ff4962">&gt; engineer systems</text><text x="492" y="421" fill="#70e9f3">&gt; ship value_</text></g>
<!-- particles --> <g fill="#f54159"><circle cx="358" cy="279" r="2"><animate attributeName="cy" values="279;250;279" dur="3s" repeatCount="indefinite"/></circle><circle cx="767" cy="105" r="2"><animate attributeName="cy" values="105;130;105" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="1080" cy="365" r="2"><animate attributeName="cy" values="365;334;365" dur="3.2s" repeatCount="indefinite"/></circle></g>
<!-- title --><g font-family="Arial, sans-serif"><text x="70" y="355" fill="#fff" font-size="52" font-weight="800" letter-spacing="8">IMRAN A</text><text x="74" y="388" fill="#ff4a61" font-size="14" font-weight="700" letter-spacing="4">SOFTWARE ENGINEER  /  AI ENGINEER</text><text x="74" y="416" fill="#b7cad0" font-size="14" letter-spacing="2">SOFTWARE × AI × GENERATIVE AI × PRODUCT ENGINEERING</text></g>
<g font-family="monospace" font-size="11" letter-spacing="2"><rect x="70" y="470" width="230" height="25" rx="12" fill="#0a161a" stroke="#41d9e6" stroke-opacity=".6"/><circle cx="86" cy="482" r="4" fill="#58f0b0"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="100" y="486" fill="#bafaff">SYSTEMS / ONLINE</text></g>
<rect x="1" y="1" width="1198" height="558" rx="17" fill="none" stroke="#ef3150" stroke-opacity=".55"/>
</svg>
