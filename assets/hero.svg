<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Imran A cinematic developer command center with AI visualisations"><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02030a"/><stop offset=".5" stop-color="#080b18"/><stop offset="1" stop-color="#050713"/></linearGradient><radialGradient id="crimson"><stop stop-color="#ff2d55" stop-opacity=".34"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#00f5ff" stop-opacity=".26"/><stop offset="1" stop-color="#00f5ff" stop-opacity="0"/></radialGradient><linearGradient id="name"><stop stop-color="#ff2d55"/><stop offset=".34" stop-color="#ff6b8a"/><stop offset=".67" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="edge"><stop stop-color="#ff2d55"/><stop offset=".4" stop-color="#ff3b81"/><stop offset=".7" stop-color="#a855f7"/><stop offset="1" stop-color="#00f5ff"/></linearGradient><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#061d2b"/><stop offset=".55" stop-color="#13113a"/><stop offset="1" stop-color="#240d2d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur"><feGaussianBlur stdDeviation="34"/></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#22d3ee" stroke-opacity=".07"/></pattern><style><![CDATA[.float{animation:f 6s ease-in-out infinite}.pulse{animation:p 3s ease-in-out infinite}.dash{stroke-dasharray:9 15;animation:d 5s linear infinite}.sweep{animation:s 8s linear infinite}@keyframes f{50%{transform:translateY(-9px)}}@keyframes p{50%{opacity:.3}}@keyframes d{to{stroke-dashoffset:-144}}@keyframes s{from{transform:translateX(-300px)}to{transform:translateX(1250px)}}]]></style></defs>
<rect width="1200" height="620" rx="24" fill="url(#bg)"/><rect width="1200" height="620" rx="24" fill="url(#grid)"/><ellipse cx="150" cy="115" rx="380" ry="260" fill="url(#crimson)" filter="url(#blur)"/><ellipse cx="1060" cy="165" rx="390" ry="270" fill="url(#cyan)" filter="url(#blur)"/><ellipse cx="650" cy="-20" rx="280" ry="170" fill="#a855f7" opacity=".15" filter="url(#blur)"/>
<path class="sweep" d="M-200 38H250" stroke="url(#edge)" stroke-width="2" opacity=".8"/><g font-family="Arial,sans-serif" transform="translate(62 76)"><text fill="url(#edge)" font-size="12" font-weight="700" letter-spacing="5">AI ENGINEERING / PRODUCT SYSTEMS</text><text y="72" fill="url(#name)" filter="url(#glow)" font-size="65" font-weight="800" letter-spacing="5">IMRAN A</text><text y="111" fill="#8dc2d1" font-size="17" letter-spacing="4">SOFTWARE ENGINEER  ·  AI ENGINEER</text><path d="M0 139H522" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/><text y="174" fill="#8c9dac" font-size="13" letter-spacing="2">DESIGNING DATA-RICH, INTELLIGENT PRODUCTS THAT SHIP</text>
<g class="float" transform="translate(0 224)"><rect width="420" height="193" rx="18" fill="#07101e" fill-opacity=".86" stroke="url(#edge)" stroke-width="2"/><text x="23" y="35" fill="url(#edge)" font-family="monospace" font-size="12" letter-spacing="2">LIVE / CLARA INFERENCE</text><path d="M22 51H398" stroke="#2e4358"/><text x="23" y="84" fill="#31e1ed" font-family="monospace" font-size="13">› context.retrieve(policy, claims)</text><text x="23" y="113" fill="#b78aff" font-family="monospace" font-size="13">› vectors.ground(response)</text><text x="23" y="142" fill="#ff6b8a" font-family="monospace" font-size="13">› answer.stream()</text><rect x="23" y="162" width="300" height="6" rx="3" fill="#213b50"/><rect x="23" y="162" width="216" height="6" rx="3" fill="url(#edge)" filter="url(#glow)"/><circle class="pulse" cx="374" cy="165" r="7" fill="#22d3ee"/></g></g>
<!-- illuminated developer silhouette and workstation --><g class="float" transform="translate(655 48)"><ellipse cx="292" cy="454" rx="300" ry="48" fill="#000" opacity=".32"/><path d="M64 440H525L570 500H20Z" fill="#050914" stroke="url(#edge)" stroke-width="2"/><path d="M86 436H502" stroke="url(#edge)" stroke-width="5" filter="url(#glow)"/><rect x="97" y="72" width="390" height="340" rx="18" fill="#07101d" stroke="url(#edge)" stroke-width="3"/><rect x="117" y="94" width="350" height="282" rx="8" fill="url(#screen)"/><g opacity=".32" stroke="#22d3ee"><path d="M136 145H447M136 190H447M136 235H447M136 280H447M136 325H447"/></g><path d="M139 319C180 274 206 306 242 245S305 297 348 194 407 217 448 135" fill="none" stroke="url(#edge)" stroke-width="5" filter="url(#glow)"/><g fill="#22d3ee" filter="url(#glow)"><circle class="pulse" cx="180" cy="274" r="6"/><circle cx="242" cy="245" r="6"/><circle class="pulse" cx="348" cy="194" r="6"/><circle cx="448" cy="135" r="6"/></g><text x="137" y="120" fill="#92e9ee" font-family="monospace" font-size="10" letter-spacing="2">NEURAL OPERATIONS · ACTIVE</text><g transform="translate(510 105)"><rect width="110" height="194" rx="15" fill="#07101d" fill-opacity=".9" stroke="url(#edge)" stroke-width="2"/><text x="16" y="31" fill="#bd94ff" font-family="monospace" font-size="9">DATA FLOW</text><path class="dash" d="M22 62h68M22 96h48M22 130h65M22 164h38" stroke="#22d3ee" stroke-width="3"/></g><g transform="translate(-30 132)"><rect width="100" height="176" rx="14" fill="#08101e" stroke="url(#edge)" stroke-width="2"/><path d="M22 54L76 82M22 133L76 82M22 54L22 133" stroke="#ff3b81"/><g fill="#a855f7"><circle class="pulse" cx="22" cy="54" r="6"/><circle cx="76" cy="82" r="6"/><circle cx="22" cy="133" r="6"/></g></g></g>
