<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Technology skills matrix">
<defs>
<linearGradient id="bg"><stop stop-color="#03040a"/><stop offset=".5" stop-color="#0b1020"/><stop offset="1" stop-color="#04050c"/></linearGradient>
