<filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.f{animation:f 3s ease-in-out infinite}.s{animation:s 5s linear infinite}@keyframes f{50%{transform:translateY(-5px)}}@keyframes s{to{stroke-dashoffset:-150}}</style>
