NIZATION</text><text y="32" fill="#b7ebf2" font-size="17">OwlSure — a business unit of ValueMomentum</text><text y="75" fill="#a97cf7" font-size="11" letter-spacing="3">LOCATION</text><text y="106" fill="#b7ebf2" font-size="17">Chennai, Tamil Nadu, India</text></g><path d="M562 54V174" stroke="#314d5c" stroke-dasharray="5 8"/><circle cx="562" cy="112" r="6" fill="#ff2d55" filter="url(#glow)" class="pulse"/></svg>