<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="92" viewBox="0 0 1100 92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Connect">
<defs>
  <filter id="soft" x="-15%" y="-80%" width="130%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#111827" stop-opacity=".08"/>
    <stop offset=".5" stop-color="#111827" stop-opacity=".6"/>
    <stop offset="1" stop-color="#111827" stop-opacity=".08"/>
  </linearGradient>
</defs>

<text x="550" y="53"
      text-anchor="middle"
      font-family="Inter,Segoe UI,Verdana,Arial,sans-serif"
      font-weight="800"
      font-size="32"
      letter-spacing="1"
      fill="#111111"
      filter="url(#soft)">
  📡 Connect
  <animate attributeName="opacity"
           values="0.72;1;0.72"
           dur="3s"
           repeatCount="indefinite"/>
  <animateTransform attributeName="transform"
                    type="translate"
                    values="0 0;0 -2;0 0"
                    dur="3s"
                    repeatCount="indefinite"/>
</text>

<rect x="230" y="70" width="640" height="2" rx="1" fill="url(#line)"/>

<rect x="0" y="69" width="150" height="2.5" rx="1.25" fill="#111111" opacity=".28">
  <animate attributeName="x"
           values="-170;1120;-170"
           dur="5s"
           repeatCount="indefinite"/>
</rect>

<circle cx="205" cy="71" r="2.8" fill="#111111" opacity=".55">
  <animate attributeName="r"
           values="2.2;4;2.2"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<circle cx="895" cy="71" r="2.8" fill="#111111" opacity=".55">
  <animate attributeName="r"
           values="2.2;4;2.2"
           dur="2.4s"
           repeatCount="indefinite"/>
</circle>
</svg>