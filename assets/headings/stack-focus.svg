<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="92" viewBox="0 0 1100 92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="🛰️ Stack and Focus">
<defs>
  <linearGradient id="text" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#9aa9bd" stop-opacity=".15"/>
    <stop offset=".5" stop-color="#00a9c7" stop-opacity=".9"/>
    <stop offset="1" stop-color="#9aa9bd" stop-opacity=".15"/>
  </linearGradient>
  <filter id="softGlow" x="-15%" y="-50%" width="130%" height="200%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<text x="550" y="53"
      text-anchor="middle"
      font-family="Inter,Segoe UI,Verdana,Arial,sans-serif"
      font-weight="800"
      font-size="32"
      letter-spacing="0.8"
      fill="#ffffff"
      filter="url(#softGlow)">
  🛰️ Stack and Focus
  <animate attributeName="opacity"
           values="0.9;1;0.9"
           dur="3.6s"
           repeatCount="indefinite"/>
</text>

<rect x="235" y="70" width="630" height="2" rx="1" fill="url(#line)"/>

<rect x="0" y="69" width="150" height="2.5" rx="1.25" fill="#00a9c7" opacity=".55">
  <animate attributeName="x" values="-170;1120;-170" dur="5.2s" repeatCount="indefinite"/>
</rect>

<circle cx="205" cy="71" r="2.8" fill="#00a9c7" opacity=".75">
  <animate attributeName="r" values="2.4;4;2.4" dur="2.2s" repeatCount="indefinite"/>
</circle>

<circle cx="895" cy="71" r="2.8" fill="#5f7f9c" opacity=".75">
  <animate attributeName="r" values="2.4;4;2.4" dur="2.5s" repeatCount="indefinite"/>
</circle>
</svg>