<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="100" viewBox="0 0 1100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Languages I Work With">
  <defs>
    <filter id="softBlur" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="5">
        <animate attributeName="stdDeviation" values="6;0;6" keyTimes="0;0.28;0.78;1" dur="3.6s" repeatCount="indefinite"/>
      </feGaussianBlur>
    </filter>
  </defs>

  <!-- Always-readable base text -->
  <text
    x="550"
    y="60"
    text-anchor="middle"
    font-family="Inter,Arial,sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="0"
    fill="#111111"
  >Languages I Work With</text>

  <!-- FlipFade-style animated pass -->
  <g filter="url(#softBlur)" opacity="0">
    <text
      x="550"
      y="60"
      text-anchor="middle"
      font-family="Inter,Arial,sans-serif"
      font-size="32"
      font-weight="800"
      letter-spacing="0"
      fill="#111111"
    >Languages I Work With
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.28;0.78;1" dur="3.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 16;0 0;0 0;0 -10" keyTimes="0;0.28;0.78;1" dur="3.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="250" y="79" width="600" height="2" rx="1" fill="#111111" opacity=".12"/>
</svg>