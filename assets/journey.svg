<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="AI engineering journey"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020204"/><stop offset=".55" stop-color="#090713"/><stop offset="1" stop-color="#030d13"/></linearGradient><linearGradient id="hot" x2="1"><stop stop-color="#ff2d55"/><stop offset=".48" stop-color="#f43f5e"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="28"/></filter><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#38bdf8" stroke-opacity=".08"/></pattern><style><![CDATA[.pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 5s linear infinite}.dash{stroke-dasharray:8 13;animation:dash 3.5s linear infinite}@keyframes pulse{50%{opacity:.38}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes scan{from{transform:translateY(-180px)}to{transform:translateY(700px)}}@keyframes dash{to{stroke-dashoffset:-105}}]]></style></defs><rect width="1200" height="280" rx="22" fill="url(#bg)"/><rect width="1200" height="280" rx="22" fill="url(#grid)"/><path d="M110 155H1090" stroke="#2d5664" stroke-width="3" class="dash"/><g font-family="Arial" text-anchor="middle"><circle cx="110" cy="155" r="40" fill="#07131c" stroke="#ff2d55" stroke-width="2" filter="url(#glow)" class="pulse"/><text x="110" y="160" fill="#ff2d55" font-size="13" font-weight="700">CS</text><text x="110" y="225" fill="#b4d3d9" font-size="11" letter-spacing="1">COMPUTER SCIENCE</text><circle cx="306" cy="155" r="40" fill="#07131c" stroke="#f43f5e" stroke-width="2" filter="url(#glow)" class="pulse"/><text x="306" y="160" fill="#f43f5e" font-size="13" font-weight="700">AI</text><text x="306" y="225" fill="#b4d3d9" font-size="11" letter-spacing="1">AI / ML</text><circle cx="502" cy="155" r="40" fill="#07131c" stroke="#a855f7" stroke-width="2" filter="url(#glow)" class="pulse"/><text x="502" y="160" fill="#a855f7" font-size="13" font-weight="700">CV</text><text x="502" y="225" fill="#b4d3d9" font-size="11" letter-spacing="1">COMPUTER VISION</text><circle cx="698" cy="155" r="40" fill="#07131c" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" class="pulse"/><text x="698" y="160" fill="#22d3ee" font-size="13" font-weight="700">SE</text><text x="698" y="225" fill="#b4d3d9" font-size="11" letter-spacing="1">SOFTWARE ENGINEERING</text><circle cx="894" cy="155" r="40" fill="#07131c" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" class="pulse"/><text x="894" y="160" fill="#38bdf8" font-size="13" font-weight="700">GEN</text><text x="894" y="225" fill="#b4d3d9" font-size="11" letter-spacing="1">GENERATIVE AI</text><circle cx="1090" cy="155" r="40" fill="#07131c" stroke="#00e5ff" stroke-width="2" filter="url(#glow)" class="pulse"/><text x="1090" y="160" fill="#00e5ff" font-size="13" font-weight="700">AI+</text><text x="1090" y="225" fill="#b4d3d9" font-size="11" letter-spacing="1">AI PRODUCT ENGINEERING</text></g></svg>