<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-label="Animated dot-matrix coding hero for Imran A">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02030a"/>
    <stop offset=".42" stop-color="#090b18"/>
    <stop offset=".72" stop-color="#12091a"/>
    <stop offset="1" stop-color="#02030a"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2d55">
      <animate attributeName="stop-color" values="#ff2d55;#ff5f8f;#ff2d55" dur="4s" repeatCount="indefinite"/>
    </stop>
    <stop offset=".48" stop-color="#d946ef">
      <animate attributeName="stop-color" values="#d946ef;#8b5cf6;#d946ef" dur="4s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#22d3ee">
      <animate attributeName="stop-color" values="#22d3ee;#67e8f9;#22d3ee" dur="4s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#6366f1"/>
    <stop offset="1" stop-color="#d946ef"/>
  </linearGradient>
  <radialGradient id="redGlow"><stop stop-color="#ff2d55" stop-opacity=".22"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>
  <radialGradient id="blueGlow"><stop stop-color="#22d3ee" stop-opacity=".17"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textGlow" x="-40%" y="-60%" width="180%" height="220%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="whiteGlow" x="-50%" y="-80%" width="200%" height="260%">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <mask id="nameReveal">
    <rect x="0" y="0" width="0" height="220" fill="white">
      <animate attributeName="width" values="0;560;560;0" keyTimes="0;.24;.78;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </mask>
  <style>
    .scan { animation: scan 6s linear infinite; }
    .blink { animation: blink 1.4s steps(2,end) infinite; }
    .float { animation: float 4s ease-in-out infinite; }
    .robot-walk-a { transform-origin: 0 0; animation: robotWalkA .55s ease-in-out infinite alternate; }
    .robot-walk-b { transform-origin: 0 0; animation: robotWalkB .55s ease-in-out infinite alternate; }
    .robot-arm-a { transform-origin: 0 0; animation: robotArmA 1.1s ease-in-out infinite alternate; }
    .robot-arm-b { transform-origin: 0 0; animation: robotArmB 1.1s ease-in-out infinite alternate; }
    .robot-eye { animation: robotEye 2.8s steps(2,end) infinite; }
    .robot-scan { animation: robotScan 2.4s linear infinite; }
    .ai-pulse { animation: none; }
    .ai-spark { animation: none; }
    .dash { stroke-dasharray: 10 16; }
    .pulse { animation: none; }
    @keyframes scan { from { transform: translateX(-500px);} to { transform: translateX(1550px);} }
    @keyframes blink { 50% { opacity: .15; } }
    @keyframes float { 50% { transform: translateY(-6px); } }
    @keyframes robotWalkA { from { transform: rotate(16deg); } to { transform: rotate(-16deg); } }
    @keyframes robotWalkB { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
    @keyframes robotArmA { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
    @keyframes robotArmB { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
    @keyframes robotEye { 0%, 90%, 100% { opacity: 1; } 92%, 96% { opacity: .2; } }
    @keyframes robotScan { from { transform: translateX(0); opacity: 0; } 15% { opacity: .8; } 70% { opacity: .8; } to { transform: translateX(190px); opacity: 0; } }
  </style>
</defs>

<rect width="1400" height="520" rx="34" fill="url(#bg)"/>

<ellipse cx="210" cy="220" rx="420" ry="280" fill="url(#redGlow)"/>
<ellipse cx="1190" cy="210" rx="370" ry="290" fill="url(#blueGlow)"/>

<g opacity=".13" stroke="#73819a">
  <path d="M0 80H1400M0 160H1400M0 240H1400M0 320H1400M0 400H1400M0 480H1400"/>
  <path d="M100 0V520M200 0V520M300 0V520M400 0V520M500 0V520M600 0V520M700 0V520M800 0V520M900 0V520M1000 0V520M1100 0V520M1200 0V520M1300 0V520"/>
</g>

<rect class="scan" x="-460" y="0" width="220" height="520" fill="#22d3ee" opacity=".035" filter="url(#glow)"/>

<!-- LEFT: NAME / IDENTITY -->
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="72" fill="#7eefff" font-size="14" font-weight="700" letter-spacing="5">PERSONAL CODE LAB / 2026</text>

  <g font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="900" letter-spacing="8">
  <text x="70" y="180" fill="#ffffff" filter="url(#whiteGlow)">IMRAN A
    <animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="70" y="180" fill="#ffffff" filter="url(#whiteGlow)" opacity="0">
    IMRAN A
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.72;1" dur="5.2s" repeatCount="indefinite"/>
  </text>
  <rect x="60" y="95" width="5" height="110" rx="2.5" fill="#ffffff" opacity=".0" filter="url(#whiteGlow)">
    <animate attributeName="x" values="60;470;470;60" keyTimes="0;.38;.72;1" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.2;.72;1" dur="5.2s" repeatCount="indefinite"/>
  </rect>
</g>

  <text x="74" y="226" fill="url(#cyan)" font-size="22" font-weight="700" letter-spacing="5">SOFTWARE ENGINEER  •  AI ENGINEER</text>

  <text x="74" y="260" fill="#a8b7c8" font-size="14" letter-spacing="2">
    BUILDING INTELLIGENT SYSTEMS WITH CODE
  </text>

  <!-- terminal -->
  <rect x="68" y="305" width="500" height="126" rx="20" fill="#050914" fill-opacity=".82" stroke="url(#name)" stroke-width="2"/>
  <circle cx="94" cy="332" r="5" fill="#ff2d55"/>
  <circle cx="114" cy="332" r="5" fill="#f59e0b"/>
  <circle cx="134" cy="332" r="5" fill="#22c55e"/>
  <text x="160" y="337" fill="#6f8399" font-family="monospace" font-size="11">imran@ai-lab:~/build</text>

  <text x="92" y="365" fill="#22d3ee" font-family="monospace" font-size="13">&gt; architect.system()</text>
  <text x="92" y="389" fill="#d946ef" font-family="monospace" font-size="13">&gt; build(product, intelligence)</text>
  <text x="92" y="413" fill="#ff4d73" font-family="monospace" font-size="13">&gt; ship<span class="blink">_</span></text>

  <text x="72" y="474" fill="#647a92" font-family="monospace" font-size="11" letter-spacing="1.5">
    SOFTWARE × AI × GENAI × RAG × DATA × PRODUCT
  </text>
</g>

<!-- RIGHT: DOTS DRAWING -->
<g transform="translate(650,62)">
  <text x="0" y="0" fill="#8fefff" font-family="Arial" font-size="12" font-weight="700" letter-spacing="4">LIVE VISUALIZATION / DRAWING CODE</text>

  <!-- dynamic drawing area -->
  <rect x="0" y="24" width="680" height="390" rx="28" fill="#050914" fill-opacity=".66" stroke="#253753" stroke-width="1.5"/>

  <!-- animated network -->
  <g transform="translate(315,205)">
    <circle cx="0" cy="0" r="96" fill="none" stroke="#233b51" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#1b4661" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="30" fill="#081421" stroke="url(#cyan)" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="r" values="30;34;30" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".65;1;.65" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="900" letter-spacing="2" filter="url(#whiteGlow)">AI
      <animate attributeName="opacity" values=".7;1;.7" dur="2.2s" repeatCount="indefinite"/>
    </text>

    <!-- INNER RING: rotates around the fixed center -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="74" fill="none" stroke="url(#cyan)" stroke-width="2.2" stroke-dasharray="42 18 8 16" opacity=".95" filter="url(#glow)"/>
      <circle cx="0" cy="-74" r="5" fill="#22d3ee" filter="url(#glow)"/>
      <circle cx="0" cy="74" r="4" fill="#d946ef"/>
    </g>

    <!-- OUTER RING: opposite direction, same center -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="18s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="108" fill="none" stroke="url(#name)" stroke-width="1.7" stroke-dasharray="10 24" opacity=".72"/>
      <circle cx="108" cy="0" r="4.5" fill="#ff2d55" filter="url(#glow)"/>
      <circle cx="-108" cy="0" r="4" fill="#8b5cf6"/>
    </g>

    <!-- FIXED NETWORK: no translation, only node glow -->
    <g stroke="url(#cyan)" stroke-width="2.2" fill="none" opacity=".72">
      <path d="M0 -30 L-65 -78 L-115 -30 L-86 45 L-20 82 L55 62 L78 -8 L0 -30"/>
      <path d="M0 -30 L0 -122 M-65 -78 L-140 -112 M-115 -30 L-152 18 M-86 45 L-132 90 M-20 82 L0 140 M55 62 L122 88 M78 -8 L145 -40"/>
    </g>

    <g fill="#22d3ee" filter="url(#glow)">
      <circle cx="-65" cy="-78" r="6"><animate attributeName="opacity" values=".45;1;.45" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="-115" cy="-30" r="6"><animate attributeName="opacity" values="1;.45;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="-86" cy="45" r="6"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="-20" cy="82" r="6"><animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="55" cy="62" r="6"><animate attributeName="opacity" values=".45;1;.45" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="78" cy="-8" r="6"><animate attributeName="opacity" values="1;.5;1" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- fixed surrounding particles with only opacity animation -->
    <g fill="#d946ef">
      <circle cx="-150" cy="-115" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="142" cy="-86" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="146" cy="108" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="-160" cy="112" r="3"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- code symbols being drawn -->
  <g transform="translate(34,58)">
    <text x="0" y="0" fill="#6f8499" font-family="monospace" font-size="10">render()</text>

    <g transform="translate(0,30)" stroke="url(#name)" stroke-width="3" fill="none" filter="url(#glow)">
      <path d="M42 26 L12 55 L42 84"/>
      <path d="M112 26 L142 55 L112 84"/>
      <path d="M82 16 L62 94"/>
    </g>
    <text x="12" y="132" fill="#ff6f8f" font-family="monospace" font-size="11">draw(&lt;/&gt;)</text>
  </g>

  <!-- right mini dashboard -->
  <g transform="translate(498,55)">
    <rect width="145" height="110" rx="18" fill="#07101b" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="18" y="24" fill="#7eefff" font-family="Arial" font-size="10" font-weight="700" letter-spacing="2">CODE FLOW</text>
    <g fill="none" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)">
      <path d="M18 76 C45 45 55 95 82 62 S105 40 126 52"/>
    </g>
    <circle cx="18" cy="76" r="3" fill="#ff2d55"/>
    <circle cx="82" cy="62" r="3" fill="#d946ef"/>
    <circle cx="126" cy="52" r="4" fill="#22d3ee"/>
  </g>

  <!-- AI ROBOT / small in-place walking motion -->
  <g transform="translate(430,250)" font-family="Arial,Helvetica,sans-serif">
    <!-- connection beam to the AI network -->
    <path d="M18 8 C72 -24 115 -30 162 -18" fill="none" stroke="url(#cyan)" stroke-width="2" stroke-dasharray="6 10" opacity=".7"/>
    <circle cx="18" cy="8" r="3.5" fill="#22d3ee" filter="url(#glow)"/>
    <text x="18" y="-12" fill="#7eefff" font-size="9" font-weight="700" letter-spacing="2">AI AGENT</text>

    <!-- robot halo -->
    <circle cx="105" cy="82" r="76" fill="none" stroke="#1f3850" stroke-width="1.5"/>
    <circle cx="105" cy="82" r="58" fill="none" stroke="url(#cyan)" stroke-width="1.5" stroke-dasharray="8 12" opacity=".6"/>

    <!-- head -->
    <rect x="67" y="36" width="76" height="62" rx="18" fill="#09121d" stroke="url(#name)" stroke-width="2.5" filter="url(#glow)"/>
    <circle class="robot-eye" cx="91" cy="67" r="6" fill="#22d3ee" filter="url(#glow)"/>
    <circle class="robot-eye" cx="119" cy="67" r="6" fill="#d946ef" filter="url(#glow)"/>
    <rect x="91" y="80" width="28" height="4" rx="2" fill="#7eefff" opacity=".7"/>
    <path d="M105 36V23" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="105" cy="18" r="5" fill="#22d3ee" filter="url(#glow)"/>
    <text x="105" y="116" text-anchor="middle" fill="#c9d8e6" font-size="9" font-weight="700" letter-spacing="2">REFEREE / AI</text>

    <!-- body -->
    <rect x="76" y="106" width="58" height="60" rx="14" fill="#07111c" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="105" cy="136" r="11" fill="#0a1826" stroke="url(#name)" stroke-width="2" filter="url(#glow)"/>
    <text x="105" y="140" text-anchor="middle" fill="#fff" font-size="7" font-weight="800">AI</text>

    <!-- arms -->
    <g transform="translate(76,118)" class="robot-arm-a">
      <path d="M0 0 L-22 30" stroke="#8aa3b9" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-24" cy="33" r="5" fill="#22d3ee"/>
    </g>
    <g transform="translate(134,118)" class="robot-arm-b">
      <path d="M0 0 L22 30" stroke="#8aa3b9" stroke-width="7" stroke-linecap="round"/>
      <circle cx="24" cy="33" r="5" fill="#d946ef"/>
    </g>

    <!-- legs: alternating walking-in-place -->
    <g transform="translate(89,164)">
      <g class="robot-walk-a">
        <path d="M0 0 L-5 38" stroke="#8199ad" stroke-width="8" stroke-linecap="round"/>
        <rect x="-20" y="34" width="22" height="8" rx="4" fill="#22d3ee"/>
      </g>
      <g transform="translate(32,0)" class="robot-walk-b">
        <path d="M0 0 L6 38" stroke="#8199ad" stroke-width="8" stroke-linecap="round"/>
        <rect x="-1" y="34" width="22" height="8" rx="4" fill="#d946ef"/>
      </g>
    </g>

    <!-- little AI scan from robot -->
    <rect class="robot-scan" x="8" y="214" width="55" height="2" rx="1" fill="#22d3ee" filter="url(#glow)"/>
    <text x="105" y="236" text-anchor="middle" fill="#6f8499" font-size="9" letter-spacing="2">OBSERVE • ANALYZE • GUIDE</text>
  </g>

  <!-- point stream at bottom -->
  <g transform="translate(32,326)">
    <text x="0" y="0" fill="#6f8499" font-family="monospace" font-size="10">particle_stream()</text>
    <g fill="#22d3ee">
      <circle cx="20" cy="26" r="3"><animate attributeName="cx" values="20;600;20" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="44" r="3"><animate attributeName="cx" values="80;620;80" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="62" r="3"><animate attributeName="cx" values="140;590;140" dur="6.1s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M0 26H610 M0 44H610 M0 62H610" stroke="#1e394c" stroke-width="1"/>
  </g>
</g>
</svg>